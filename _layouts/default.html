<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon/favicon.svg' | relative_url }}">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400;500&display=swap">

    <!-- Styles -->
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

    {% if page.extra_css %}
    {{ page.extra_css }}
    {% endif %}
</head>

<body>
    <div class="nav-container">
        <nav>
            <a href="{{ '/' | relative_url }}" class="nav-logo">yuan.luna_<span class="cursor-blink"></span></a>
            <div class="nav-links">
                <a href="{{ '/#intro' | relative_url }}" class="nav-link">whoami</a>
                <a href="{{ '/#work' | relative_url }}" class="nav-link">skills</a>
                <a href="{{ '/#faith' | relative_url }}" class="nav-link">core</a>
                <a href="{{ '/blog' | relative_url }}" class="nav-link">blog</a>
                <a href="{{ '/#contact' | relative_url }}" class="nav-link">contact</a>
            </div>
        </nav>
    </div>

    <main>
        {{ content }}
    </main>

    <footer class="site-footer">
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}</p>
    </footer>

    <!-- Scripts -->
    <script src="{{ '/assets/js/cursor.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/terminal.js' | relative_url }}"></script>

    <script>
        // Navigation scroll effect
        window.addEventListener('scroll', function () {
            var nav = document.querySelector('.nav-container');
            if (window.scrollY > 10) {
                nav.classList.add('scrolled');
            } else {
                nav.classList.remove('scrolled');
            }
        });
    </script>

    {% if page.extra_js %}
    {{ page.extra_js }}
    {% endif %}
</body>

</html>
